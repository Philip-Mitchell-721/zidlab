---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  timeout: 15m
  values:
    # CRDs are pre-installed cluster-wide by bootstrap/helmfile.d/00-crds.yaml.
    crds:
      enabled: false

    alertmanager:
      # Routing structure lives here in git and stays readable/diffable; the only
      # credential on this path is the webhook basic-auth password, pulled from the
      # ntfy-alertmanager-secret via password_file (mounted by alertmanagerSpec.secrets).
      config:
        route:
          receiver: ntfy
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          # Keep nagging about something still broken, but not often enough to
          # train us to ignore the phone.
          repeat_interval: 4h
          routes:
            # Watchdog fires permanently BY DESIGN — it's a liveness heartbeat, not
            # a fault. It must never reach the phone. Once a healthchecks.io check
            # exists this becomes the dead-man's switch receiver: if these pings
            # stop, the cluster (or Prometheus) is down and an external service
            # tells us, which is the one thing in-cluster monitoring cannot do.
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"

            # A control signal for the inhibit rules below, not an alert.
            - receiver: "null"
              matchers:
                - alertname = "InfoInhibitor"

            # These assume N-1 scheduling headroom that a 3-node all-control-plane
            # cluster can't satisfy, so they'd fire permanently and train us to
            # ignore everything else.
            - receiver: "null"
              matchers:
                - alertname =~ "KubeCPUOvercommit|KubeMemoryOvercommit|KubeCPUQuotaOvercommit"

            # Informational chatter: CPUThrottlingHigh, KubeletTooManyPods,
            # NodeCPUHighUsage, KubeQuota*, KubeNodeEviction/Pressure.
            - receiver: "null"
              matchers:
                - severity = "info"

        receivers:
          - name: "null"

          - name: ntfy
            webhook_configs:
              # The bridge translates Alertmanager's fixed JSON schema into an ntfy
              # push with severity-mapped priority. Alertmanager can't template a
              # webhook body itself (prometheus/alertmanager#1496), which is why a
              # translator sits here rather than posting straight to ntfy/Apprise.
              - url: http://ntfy-alertmanager.observability.svc.cluster.local:8080
                send_resolved: true
                http_config:
                  basic_auth:
                    username: webhook
                    password_file: /etc/alertmanager/secrets/ntfy-alertmanager-secret/webhook-password

      alertmanagerSpec:
        # Mounts at /etc/alertmanager/secrets/<name>/<key>
        secrets:
          - ntfy-alertmanager-secret
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi

    prometheus:
      prometheusSpec:
        # Scrape EVERY ServiceMonitor/PodMonitor/etc. already in the cluster (the 13 that
        # have been emitting into the void), not just resources this chart labels as its own.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        # TSDB is a grower — cap it well under the PVC size (planned-services.md).
        retention: 15d
        retentionSize: 17GiB
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi

    grafana:
      # Admin login comes from the SOPS secret; no password in git.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 5Gi
      # We route via Gateway API HTTPRoute, not the chart's Ingress.
      ingress:
        enabled: false
      # OIDC client id/secret arrive as GF_AUTH_* env vars from the grafana-oidc SOPS secret.
      # Grafana env overrides grafana.ini, so no credentials sit in these values.
      envFromSecret: grafana-oidc
      grafana.ini:
        server:
          # Grafana builds the OAuth redirect_uri from this — must match the Authentik provider.
          root_url: "https://grafana.${SECRET_DOMAIN}"
        auth:
          # OIDC-only: hide the username/password form. The admin user from the
          # grafana-admin secret still works over API basic auth for recovery.
          disable_login_form: true
        auth.generic_oauth:
          enabled: true
          name: Authentik
          scopes: "openid email profile"
          auth_url: "https://auth.${SECRET_DOMAIN}/application/o/authorize/"
          token_url: "https://auth.${SECRET_DOMAIN}/application/o/token/"
          api_url: "https://auth.${SECRET_DOMAIN}/application/o/userinfo/"
          # Authentik 'authentik Admins' group -> Grafana Admin; everyone else -> Viewer.
          role_attribute_path: "contains(groups, 'authentik Admins') && 'Admin' || 'Viewer'"
          allow_assign_grafana_admin: true
          allow_sign_up: true
          # redirect straight to Authentik instead of showing a login button
          auto_login: true

    # Cilium provides kube-proxy replacement — there is no kube-proxy to scrape.
    kubeProxy:
      enabled: false
