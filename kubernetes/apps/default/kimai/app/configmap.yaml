---
# Kimai SAML config mounted at /opt/kimai/config/packages/local.yaml.
# IdP values pulled from Authentik's SAML metadata for the "kimai" provider.
# Non-secret (IdP cert is public; SP does not sign requests yet) -> ConfigMap.
# debug:true + strict:false while we verify the attribute names Authentik sends;
# tighten (strict:true, wantAssertionsSigned:true) once login works.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kimai-saml
data:
  local.yaml: |
    kimai:
        saml:
            activate: true
            title: 'Login with Authentik'
            mapping:
                - { saml: '$http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress', kimai: email }
                - { saml: '$http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name', kimai: alias }
            roles:
                resetOnLogin: false
                attribute: 'http://schemas.xmlsoap.org/claims/Group'
                mapping:
                    - { saml: Admin, kimai: ROLE_SUPER_ADMIN }
            connection:
                idp:
                    entityId: 'https://auth.zidlab.com/application/saml/kimai/metadata/'
                    singleSignOnService:
                        url: 'https://auth.zidlab.com/application/saml/kimai/'
                        binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect'
                    singleLogoutService:
                        url: 'https://auth.zidlab.com/application/saml/kimai/'
                        binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect'
                    x509cert: ''
                sp:
                    entityId: 'https://kimai.zidlab.com/auth/saml/metadata'
                    assertionConsumerService:
                        url: 'https://kimai.zidlab.com/auth/saml/acs'
                        binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
                    singleLogoutService:
                        url: 'https://kimai.zidlab.com/auth/saml/logout'
                        binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect'
                strict: true
                debug: false
                security:
                    nameIdEncrypted: false
                    authnRequestsSigned: false
                    wantAssertionsSigned: true
                    wantNameId: false
                    requestedAuthnContext: false
                    signatureAlgorithm: 'http://www.w3.org/2001/04/xmldsig-more#rsa-sha256'
                    digestAlgorithm: 'http://www.w3.org/2001/04/xmlenc#sha256'
