---
# Kimai's private MySQL. Its own Deployment + PVC (a DB wants its own pod), but
# it lives in the `kimai` Flux unit because nothing else uses it. Shares the
# app-template OCIRepository (see ./ocirepository.yaml) with the web release.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kimai-mysql
spec:
  chartRef:
    kind: OCIRepository
    name: kimai
  interval: 1h
  values:
    controllers:
      kimai-mysql:
        # Single writer to the RWO /var/lib/mysql volume — never run two pods at once.
        strategy: Recreate
        containers:
          app:
            image:
              repository: mysql
              # Pinned to the 8.4 LTS line (premier support to 2029-04). Do NOT take
              # Renovate's 26.x bumps: MySQL moved to calendar versioning in 2026, and
              # "an LTS release cannot skip a lineage" -- 8.4 must go via 9.7 LTS first,
              # so a tag swap is an UNSUPPORTED upgrade path, not merely a risky one.
              # The 26.x releases are ~3-month Innovation builds besides.
              #
              # Correcting an earlier comment here: neither of these is the blocker.
              # Kimai accepts "MySQL >= 8.4 or newer", and DATABASE_URL's serverVersion
              # is only a Doctrine platform hint, never checked against the live server
              # (DBAL ships no MySQL9Platform, so 8.4.0 picks what it would anyway).
              tag: "8.4"
            env:
              # Non-secret bootstrap; passwords come from kimai-mysql-secret.
              MYSQL_DATABASE: kimai
              MYSQL_USER: kimai
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: kimai-mysql-secret   # MYSQL_ROOT_PASSWORD + MYSQL_PASSWORD
            args:
              - --default-storage-engine=innodb   # parity with your desktop compose
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 384Mi
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          mysql:
            # service.app -> Service named after the release => DNS "kimai-mysql".
            port: 3306
    persistence:
      data:
        existingClaim: kimai-mysql-data
        globalMounts:
          - path: /var/lib/mysql
