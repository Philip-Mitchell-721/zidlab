---
# Kimai's private MySQL. Its own Deployment + PVC (a DB wants its own pod), but
# it lives in the `kimai` Flux unit because nothing else uses it. Shares the
# app-template OCIRepository (see ./ocirepository.yaml) with the web release.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kimai-mysql
spec:
  chartRef:
    kind: OCIRepository
    name: kimai
  interval: 1h
  values:
    controllers:
      kimai-mysql:
        # Single writer to the RWO /var/lib/mysql volume — never run two pods at once.
        strategy: Recreate
        containers:
          app:
            image:
              repository: mysql
              # 8.4 LTS. Your desktop's 8.3 is an EOL "innovation" release; a
              # mysqldump from 8.3 restores into 8.4 cleanly, and the kimai
              # DATABASE_URL pins serverVersion=8.4.0 to match.
              tag: "8.4"
            env:
              # Non-secret bootstrap; passwords come from kimai-mysql-secret.
              MYSQL_DATABASE: kimai
              MYSQL_USER: kimai
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: kimai-mysql-secret   # MYSQL_ROOT_PASSWORD + MYSQL_PASSWORD
            args:
              - --default-storage-engine=innodb   # parity with your desktop compose
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 384Mi
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          mysql:
            # service.app -> Service named after the release => DNS "kimai-mysql".
            port: 3306
    persistence:
      data:
        existingClaim: kimai-mysql-data
        globalMounts:
          - path: /var/lib/mysql
