---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
spec:
  chartRef:
    kind: OCIRepository
    name: mealie
  interval: 1h
  values:
    controllers:
      mealie:
        # One pod at a time — it owns the RWO /app/data volume and runs DB
        # migrations on boot. Reloader restarts it when its secrets change
        # (the CNPG password or the OIDC creds).
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Block startup until Postgres accepts TCP — avoids a boot-time migration
          # crash loop if the pod races ahead of the DB.
          wait-for-db:
            image:
              repository: busybox
              tag: "1.37"
            command:
              - sh
              - -c
              - until nc -z mealie-postgres-rw 5432; do echo "waiting for mealie-postgres-rw:5432"; sleep 2; done
        containers:
          app:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              # Pinned to match Phil's desktop instance (v3.13.1) so the first backup
              # restore is a clean same-version import (zero forward migrations). Bump
              # to a newer tag as a SEPARATE step AFTER the restore verifies clean.
              tag: v3.13.1
            env:
              TZ: America/New_York
              # Public URL — used for the OIDC callback and notification links. Safe
              # to set now: the hostname is identical whether served LAN-only
              # (envoy-internal) or public (envoy-external), so this survives the flip.
              BASE_URL: https://mealie.${SECRET_DOMAIN}
              # Keep self-service signup closed. Users arrive via the backup restore
              # and (phase 2) Authentik OIDC — never open registration.
              ALLOW_SIGNUP: "false"
              # --- Postgres (CNPG-managed) ---
              DB_ENGINE: postgres
              POSTGRES_USER: mealie
              POSTGRES_DB: mealie
              POSTGRES_SERVER: mealie-postgres-rw   # CNPG read-write Service
              POSTGRES_PORT: "5432"
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: mealie-postgres-app        # generated by CNPG
                    key: password
              # --- OIDC (Authentik) — staged OFF for phase 1 ---
              # Phase 2: create the Authentik OIDC provider (app slug "mealie"), put
              # the client id/secret in the mealie-oidc secret, flip this to "true".
              OIDC_AUTH_ENABLED: "false"
              OIDC_PROVIDER_NAME: Authentik
              OIDC_CONFIGURATION_URL: https://auth.${SECRET_DOMAIN}/application/o/mealie/.well-known/openid-configuration
              # Keep the local login button reachable (break-glass admin) — don't
              # auto-bounce straight to Authentik.
              OIDC_AUTO_REDIRECT: "false"
              OIDC_SIGNUP_ENABLED: "true"
              # Authentik groups gate access + admin. Create these groups and attach a
              # groups scope-mapping to the provider (see docs/mealie-migration.md).
              OIDC_USER_GROUP: mealie-users
              OIDC_ADMIN_GROUP: mealie-admins
              # Default is True; matching an existing user by email needs the email
              # asserted verified. Our Authentik "OpenID email (verified)" mapping
              # (fixed during the Audiobookshelf deploy) already returns
              # email_verified:true — attach it to this provider. Set to "false" here
              # only if you skip that mapping.
              # OIDC_REQUIRES_EMAIL_VERIFICATION: "true"
            envFrom:
              - secretRef:
                  name: mealie-oidc   # OIDC_CLIENT_ID + OIDC_CLIENT_SECRET
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          http:
            # The single mealie-recipes/mealie image serves the API + UI on 9000.
            port: 9000
    persistence:
      data:
        existingClaim: mealie-data
        globalMounts:
          - path: /app/data
    route:
      app:
        # LAN-only via envoy-internal for phase 1 (migrate + verify). Flip parentRefs
        # to envoy-external in phase 2 once OIDC is wired — external-dns then publishes
        # mealie.<domain> through the Cloudflare tunnel. Signup stays closed either way.
        hostnames: ["mealie.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 9000
