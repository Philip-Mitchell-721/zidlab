---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rallly
spec:
  interval: 1h
  path: ./kubernetes/apps/default/rallly/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  # The CNPG Cluster lives in this same unit, so we only need the operator's CRDs to
  # exist first. DB-readiness ordering is handled at runtime by the wait-for-db
  # initContainer + the secretKeyRef on CNPG's generated connection secret.
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
