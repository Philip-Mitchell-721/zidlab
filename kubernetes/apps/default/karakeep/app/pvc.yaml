---
# SQLite DB + full-page archives and asset blobs — this is the one that grows.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
# Rebuildable search index — kept separate so it can be wiped without the data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-meilisearch
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
