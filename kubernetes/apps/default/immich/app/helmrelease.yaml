---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    controllers:
      # --- Immich server: API + web UI + background jobs (thumbnails, transcode, etc.) ---
      immich:
        # Single writer to the RWO thumbs volume + the DB migrations on boot.
        strategy: Recreate
        annotations:
          # Restart when the CNPG password secret changes.
          reloader.stakater.com/auto: "true"
        initContainers:
          # Block startup until Postgres accepts TCP — avoids a boot-time migration crash
          # loop if the pod races ahead of the DB.
          wait-for-db:
            image:
              repository: busybox
              tag: "1.37"
            command:
              - sh
              - -c
              - until nc -z immich-postgres-rw 5432; do echo "waiting for immich-postgres-rw:5432"; sleep 2; done
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.0.3
            env:
              TZ: America/New_York
              # --- Postgres (CNPG + VectorChord) ---
              DB_HOSTNAME: immich-postgres-rw    # CNPG read-write Service
              DB_PORT: "5432"
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              # Be explicit about the vector backend (image also carries pgvector).
              DB_VECTOR_EXTENSION: vectorchord
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-app     # generated by CNPG
                    key: password
              # --- Redis / Valkey (job queue) ---
              REDIS_HOSTNAME: immich-redis
              REDIS_PORT: "6379"
              # --- Machine learning endpoint (the machine-learning controller below) ---
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
      # --- Machine learning: CLIP (smart search) + face-detection models. These are small
      # vision/embedding models (NOT an LLM), run on CPU (no GPU on these nodes). It's a
      # background batch job — CPU-busy during the initial index, then idle. RAM bursts
      # while indexing; bump the limit if it ever OOMKills mid-index. ---
      machine-learning:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.0.3
            env:
              TZ: America/New_York
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
      # --- Redis / Valkey: Immich's job queue + cache. Ephemeral (emptyDir) — the queue
      # rebuilds itself; nothing precious lives here. ---
      redis:
        containers:
          app:
            image:
              repository: docker.io/valkey/valkey
              tag: 8.1-alpine
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    service:
      # Primary Service, named after the release -> `immich` (the server, port 2283).
      app:
        controller: immich
        ports:
          http:
            port: 2283
      # Non-primary keys -> `immich-machine-learning` and `immich-redis` (the DNS names
      # the server env points at above).
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003
      redis:
        controller: redis
        ports:
          redis:
            port: 6379
    persistence:
      # The photo library on the interim desktop SMB share (/Videos/Immich subfolder).
      # This is /data inside the container: originals (library/), temp staging (upload/),
      # transcoded video (encoded-video/), profile images. Only the server touches it.
      media:
        existingClaim: immich-media
        advancedMounts:
          immich:
            app:
              - path: /data
                subPath: Immich
      # Thumbnails on fast Longhorn, overlaid at /data/thumbs — the hot, tiny-file browse
      # path stays snappy even over the slow interim SMB link (per docs/planned-services.md:
      # "thumbnails -> LH, photos -> share"). Server only.
      thumbs:
        existingClaim: immich-thumbs
        advancedMounts:
          immich:
            app:
              - path: /data/thumbs
      # ML model cache (downloaded CLIP + face models) — persist so they aren't re-fetched
      # on every ML pod restart. ML container only.
      ml-cache:
        existingClaim: immich-ml-cache
        advancedMounts:
          machine-learning:
            app:
              - path: /cache
    route:
      app:
        # LAN-only first (envoy-internal). After Authentik OIDC is wired + verified in the
        # Immich UI, flip to envoy-external to go public (family share links). external-dns
        # publishes immich.<domain>. Unlike Mealie we keep the app publicly reachable (no
        # forward-auth) so grandparents' tokenised share links work.
        hostnames: ["immich.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 2283
