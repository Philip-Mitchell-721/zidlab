---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: isponsorblocktv
spec:
  chartRef:
    kind: OCIRepository
    name: isponsorblocktv
  interval: 1h
  values:
    controllers:
      isponsorblocktv:
        annotations:
          reloader.stakater.com/auto: "true"
        # a screen holds one lounge session; never two pods
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/dmunozv04/isponsorblocktv
              tag: v2.10.0
            env:
              TZ: America/New_York
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
    defaultPodOptions:
      securityContext:
        # image declares no USER; nothing here writes, so no fsGroup needed
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    # No Service, route or probes: it listens on nothing. It dials out to
    # youtube.com/api/lounge and YouTube relays to the Apple TV, so it also
    # needs no network adjacency to the TV.
    persistence:
      # Read-only: the app never writes its config, and screen_id is a
      # credential. See docs/setup/isponsorblocktv-setup.md.
      config:
        type: secret
        name: isponsorblocktv-secret
        globalMounts:
          - path: /app/data/config.json
            subPath: config.json
            readOnly: true
