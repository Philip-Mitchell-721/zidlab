---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: sabnzbd
  interval: 1h
  values:
    controllers:
      sabnzbd:
        # single writer to the RWO config volume; no gluetun — Usenet is a direct
        # SSL connection to the provider, no VPN/swarm involved (unlike qbittorrent)
        strategy: Recreate
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/sabnzbd
              tag: 5.0.4-ls263
            env:
              PUID: 1000
              PGID: 1000
              TZ: America/New_York
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              # par2 repair + unpack are bursty; give it headroom.
              # SABnzbd sizes its article cache (cache_limit=1G) from the NODE's
              # RAM — it can't see the cgroup limit — so peak = 1G cache + unrar
              # (a child process in the same cgroup) + assembler buffers. 2Gi was
              # OOMKilled (exit 137) mid-unpack on 2026-08-05 when Sonarr fired
              # ~43 grabs at once. 4Gi is a runaway-catcher, not a working ceiling.
              limits:
                memory: 4Gi
    service:
      app:
        ports:
          http:
            port: &port 8080
    persistence:
      config:
        existingClaim: sabnzbd-config
        globalMounts:
          - path: /config
      # shared library volume — SABnzbd writes downloads under /data/usenet so
      # Sonarr/Radarr can hardlink into /data/media on the same filesystem
      media:
        existingClaim: media-data
        globalMounts:
          - path: /data
    route:
      app:
        # LAN-only, like the *arr UIs — not exposed via the Cloudflare tunnel
        hostnames: ["sabnzbd.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
