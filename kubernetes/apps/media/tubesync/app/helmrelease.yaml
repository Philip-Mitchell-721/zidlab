---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tubesync
spec:
  chartRef:
    kind: OCIRepository
    name: tubesync
  interval: 1h
  values:
    controllers:
      tubesync:
        # single writer to the RWO config volume (SQLite) — one pod at a time
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/meeb/tubesync
              tag: v0.18.3
            env:
              PUID: 1000
              PGID: 1000
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: tubesync-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              # ffmpeg remuxes each finished download — bursty, so headroom over the request
              limits:
                memory: 2Gi
    service:
      app:
        ports:
          http:
            port: &port 4848
    persistence:
      config:
        existingClaim: tubesync-config
        globalMounts:
          - path: /config
      # /downloads is hard-coded in the image, so the share's YouTube/ folder is
      # subPath-mounted onto it rather than the /data layout the arr stack uses
      downloads:
        existingClaim: media-data
        globalMounts:
          - path: /downloads
            subPath: YouTube
    route:
      app:
        # LAN-only, like the rest of the media stack
        hostnames: ["tubesync.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
