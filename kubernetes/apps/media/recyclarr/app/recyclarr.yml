# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# TRaSH guide defaults, with exactly ONE deviation:
#
#   - the anime profile scores "Dubs Only" 0 instead of -10000, because we watch
#     English dubs and the guide's -10000 rejects dub-only releases outright.
#
# No quality ladder, cutoff, or format score is overridden anywhere else. Verify
# with: recyclarr sync --preview, or the CF audit in docs/arr-stack-troubleshooting.md.
#
# Two things the guides cannot decide for a single-instance setup:
#
#   1. quality_definition — the guide prescribes 'series' for the TV profile and
#      'anime' for the anime profile (they assume two separate Sonarr instances).
#      Recyclarr allows one per instance. We use 'anime': it differs from 'series'
#      ONLY by lowering the minimum size floor (5 vs 15 MB/min; preferred 995 and
#      max 1000 are identical), so it can admit small encodes but can never reject
#      anything 'series' would have accepted. 'series' would re-break small anime
#      encodes, which is the bug that cost a full day in July.
#   2. Profile names are overridden for UI recognition only — no behavioural
#      effect, and recyclarr renames in place by trash_id so assignments survive.
#
radarr:
  radarr-main:
    base_url: http://radarr.media.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: sqp-streaming  # guide default for the SQP-1 WEB profile

    quality_profiles:
      - trash_id: 90a3370d2d30cbaf08d9c23b856a12c8  # [SQP] SQP-1 WEB (1080p)
        name: "Trash Movie 1080p"
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 15b1cf0b6f1a1493856a4355907affee  # [Unwanted] Unwanted Formats SQP

sonarr:
  sonarr-main:
    base_url: http://sonarr.media.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY

    quality_definition:
      type: anime  # see note 1 in the header

    quality_profiles:
      # --- general TV ---
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        name: "Trash TV 1080p"
        reset_unmatched_scores:
          enabled: true

      # --- anime ---
      # Stock "[Anime] Remux-1080p": Bluray 1080p (Remux + encode) is the TOP
      # tier and the cutoff, so this profile prefers ~7GB/ep Remux and will
      # upgrade existing WEB files up to it. That is the guide's intent.
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
        name: "Trash Anime 1080p"
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        # --- general TV ---
        - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
        # --- anime ---
        - trash_id: 4b196eed652c65ea98d615212040ebe2  # [Required] Anime Versions (prefer v2/v3)
        - trash_id: f206572b1147d0221bb1c96765b349e8  # [Release Groups] Anime (tier fansub groups)
        - trash_id: f54985e5e96747cef58731f1cf4c9181  # [Streaming Services] Anime

    custom_formats:
      # THE ONE DEVIATION. TRaSH scores "Dubs Only" -10000, which rejects
      # English-dub-only releases — exactly what we want to keep. Neutralise it
      # to 0. (VOSTFR stays at -10000: that's French subs, not dubs.)
      - trash_ids:
          - 9c14d194486c4014d422adc64092d794  # Dubs Only
        assign_scores_to:
          - name: "Trash Anime 1080p"
            score: 0
