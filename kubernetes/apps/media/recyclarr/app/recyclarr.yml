# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# TRaSH guide defaults, with exactly TWO deviations:
#
#   1. No Blu-ray, anywhere. The TV template is WEB-only out of the box, but the
#      movie and anime templates both allow Blu-ray (see the notes on each
#      profile below), so their quality ladders are overridden. The overrides
#      subtract the Blu-ray tiers and NOTHING else — every other quality the
#      template allows stays allowed, in the template's own order.
#   2. The anime profile scores "Dubs Only" 0 instead of -10000, because we watch
#      English dubs and the guide's -10000 rejects dub-only releases outright.
#
# No format score, min score, or cutoff score is overridden anywhere else. Verify
# with: recyclarr sync --preview, or the CF audit in docs/arr-stack-troubleshooting.md.
#
# Two things the guides cannot decide for a single-instance setup:
#
#   1. quality_definition — the guide prescribes 'series' for the TV profile and
#      'anime' for the anime profile (they assume two separate Sonarr instances).
#      Recyclarr allows one per instance. We use 'anime': it differs from 'series'
#      ONLY by lowering the minimum size floor (5 vs 15 MB/min; preferred 995 and
#      max 1000 are identical), so it can admit small encodes but can never reject
#      anything 'series' would have accepted. 'series' would re-break small anime
#      encodes, which is the bug that cost a full day in July.
#   2. Profile names are overridden for UI recognition only — no behavioural
#      effect, and recyclarr renames in place by trash_id so assignments survive.
#
radarr:
  radarr-main:
    base_url: http://radarr.media.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: sqp-streaming  # guide default for the SQP-1 WEB profile

    quality_profiles:
      # Despite the "WEB" in its name, the SQP-1 WEB template's top tier is a
      # group literally called "Bluray|WEB-1080p" — Bluray-1080p sits alongside
      # WEBDL/WEBRip and is the cutoff. Deviation 1 drops it, so only WEB is
      # ever grabbed. Scores are untouched (min 1000, cutoff 10000).
      - trash_id: 90a3370d2d30cbaf08d9c23b856a12c8  # [SQP] SQP-1 WEB (1080p)
        name: "Trash Movie 1080p"
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 10000
        qualities:
          # The template's top group minus Bluray-1080p. It was the only tier
          # the template allowed, so there is nothing else to carry over.
          - name: WEB 1080p
            qualities:
              - WEBRip-1080p
              - WEBDL-1080p

    custom_format_groups:
      add:
        - trash_id: 15b1cf0b6f1a1493856a4355907affee  # [Unwanted] Unwanted Formats SQP

sonarr:
  sonarr-main:
    base_url: http://sonarr.media.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY

    quality_definition:
      type: anime  # see note 1 in the header

    quality_profiles:
      # --- general TV ---
      # Already WEB-only in the template — no quality override needed.
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        name: "Trash TV 1080p"
        reset_unmatched_scores:
          enabled: true

      # --- anime ---
      # Stock "[Anime] Remux-1080p" makes Bluray 1080p (Remux + encode) the top
      # tier AND the cutoff, so it prefers ~7GB/ep Remux and would upgrade
      # existing WEB files up to it. Deviation 1 removes the four Blu-ray tiers
      # (Bluray-1080p Remux, Bluray-1080p, Bluray-720p, Bluray-480p) and leaves
      # the rest of the template's ladder untouched — WEB 1080p/720p/480p, DVD
      # and SDTV all stay allowed as fallbacks, in the template's order. WEB
      # 1080p inherits the cutoff because the old one is gone. Scores are
      # untouched (min 100, cutoff 10000), so the fansub group tiers, streaming
      # service tags and v2/v3 version preferences all still apply.
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
        name: "Trash Anime 1080p"
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 10000
        qualities:
          - name: WEB 1080p
            qualities:
              - HDTV-1080p
              - WEBRip-1080p
              - WEBDL-1080p
          - name: WEB 720p
            qualities:
              - HDTV-720p
              - WEBRip-720p
              - WEBDL-720p
          - name: WEB 480p
            qualities:
              - WEBRip-480p
              - WEBDL-480p
          - name: DVD
          - name: SDTV

    custom_format_groups:
      add:
        # --- general TV ---
        - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
        # --- anime ---
        - trash_id: 4b196eed652c65ea98d615212040ebe2  # [Required] Anime Versions (prefer v2/v3)
        - trash_id: f206572b1147d0221bb1c96765b349e8  # [Release Groups] Anime (tier fansub groups)
        - trash_id: f54985e5e96747cef58731f1cf4c9181  # [Streaming Services] Anime

    custom_formats:
      # DEVIATION 2. TRaSH scores "Dubs Only" -10000, which rejects
      # English-dub-only releases — exactly what we want to keep. Neutralise it
      # to 0. (VOSTFR stays at -10000: that's French subs, not dubs.)
      - trash_ids:
          - 9c14d194486c4014d422adc64092d794  # Dubs Only
        assign_scores_to:
          - name: "Trash Anime 1080p"
            score: 0
