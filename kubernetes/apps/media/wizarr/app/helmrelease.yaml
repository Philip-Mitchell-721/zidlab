---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wizarr
spec:
  chartRef:
    kind: OCIRepository
    name: wizarr
  interval: 1h
  values:
    controllers:
      wizarr:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/wizarrrr/wizarr
              tag: v2026.7.1
            env:
              PUID: 1000
              PGID: 1000
              TZ: America/New_York
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 5690
                  initialDelaySeconds: 90
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  # 4 gunicorn workers boot at ~10s each — slow first start.
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  failureThreshold: 12
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      config:
        existingClaim: wizarr-config
        globalMounts:
          - path: /data
    route:
      app:
        # LAN-only until first-run completes — /setup is unauthenticated until an admin
        # account exists. Flip to envoy-external after; see docs/setup/wizarr-setup.md.
        hostnames: ["wizarr.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
