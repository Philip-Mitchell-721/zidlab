---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tautulli
spec:
  chartRef:
    kind: OCIRepository
    name: tautulli
  interval: 1h
  values:
    controllers:
      tautulli:
        # single writer to the RWO config volume (SQLite) — one pod at a time
        strategy: Recreate
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/tautulli
              tag: 2.17.2
            env:
              PUID: 1000
              PGID: 1000
              TZ: America/New_York
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        ports:
          http:
            port: &port 8181
    persistence:
      config:
        existingClaim: tautulli-config
        globalMounts:
          - path: /config
    route:
      app:
        # LAN-only, like the rest of the media stack
        hostnames: ["tautulli.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
