---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cleanuparr
spec:
  chartRef:
    kind: OCIRepository
    name: cleanuparr
  interval: 1h
  values:
    controllers:
      cleanuparr:
        # single-writer against the RWO Longhorn config volume (SQLite DB)
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/cleanuparr/cleanuparr
              tag: 2.10.0
            env:
              PUID: 1000
              PGID: 1000
              TZ: America/New_York
              # container listens on this port; keep in sync with service/route
              PORT: &port 11011
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      # config + SQLite database (connections, blocklist settings, job history)
      config:
        existingClaim: cleanuparr-config
        globalMounts:
          - path: /config
    route:
      app:
        hostnames: ["cleanuparr.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
