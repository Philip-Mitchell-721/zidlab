---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  chartRef:
    kind: OCIRepository
    name: authentik
  interval: 1h
  values:
    # global.env / global.envFrom apply to BOTH the server and worker deployments.
    # In the pod spec, env: (global.env) wins over envFrom:, and among envFrom sources
    # the chart's own config secret is listed first, so authentik-secret (below) overrides
    # the chart's empty secret_key. Net effect:
    #   - DB password  <- CNPG-generated "authentik-postgres-app" secret (never in git)
    #   - secret_key + bootstrap creds <- SOPS "authentik-secret"
    #   - host/name/user/port <- authentik.postgresql.* values (non-secret)
    global:
      env:
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-postgres-app
              key: password
        # --- Email via SMTP2GO (system mail: password reset, email verification, etc.) ---
        # Non-secret settings live here; the SMTP username + password come from the SOPS
        # "authentik-secret" (keys AUTHENTIK_EMAIL__USERNAME / __PASSWORD) via envFrom below.
        # SMTP2GO: host mail.smtp2go.com; port 2525 = STARTTLS (recommended, widely open;
        # 587 is the standard fallback). Add the two secret keys before this takes effect
        # (see docs/smtp2go-setup.md).
        - name: AUTHENTIK_EMAIL__HOST
          value: "mail.smtp2go.com"
        - name: AUTHENTIK_EMAIL__PORT
          value: "2525"
        - name: AUTHENTIK_EMAIL__USE_TLS
          value: "true"
        - name: AUTHENTIK_EMAIL__USE_SSL
          value: "false"
        - name: AUTHENTIK_EMAIL__TIMEOUT
          value: "10"
        - name: AUTHENTIK_EMAIL__FROM
          value: "authentik@${SECRET_DOMAIN}"
      envFrom:
        - secretRef:
            name: authentik-secret
    authentik:
      error_reporting:
        enabled: false
      postgresql:
        host: authentik-postgres-rw
        name: authentik
        user: authentik
        port: 5432
    # Use the external CNPG Cluster, not the chart's bundled Postgres.
    postgresql:
      enabled: false
    server:
      # Ingress off — we route via Gateway API HTTPRoute instead.
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
    worker:
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
